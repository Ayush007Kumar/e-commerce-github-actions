#Goal : To check python code is syntactically correct or not
name: Code Lint


on:
 push:

jobs:
  code-linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Code Lint
        run: ruff check .
