#Goal : To check python code is syntactically correct or not
name: Code Lint


on:
 workflow call: # allows this workflow to be called from another workflow

jobs:
  code-lint-and-test:
    strategy:
      matrix:
        python-versions: [3.12, 3.13, 3.14]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-versions }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Code Lint
        run: ruff check .
      - name: Run Tests
        run: pytest
